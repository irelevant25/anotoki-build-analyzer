@if (meta.notSetUp(); as setupUrl) {
  <!-- Nothing to sign in to and nowhere to go yet: the brand alone over the page that says how to set up. -->
  <header class="boot-bar">
    <app-brand [area]="'brand.area' | translate" />
  </header>
  <main>
    <app-not-set-up-page [setupUrl]="setupUrl" />
  </main>
} @else {
  <router-outlet />
}
