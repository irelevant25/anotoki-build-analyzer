<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">
    <mat-icon class="brand-icon">auto_awesome</mat-icon>
    <span>Hoyo Analyzer</span>
  </a>

  <nav class="nav">
    @for (link of links; track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exact }">
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="themeMenu" matTooltip="Theme" aria-label="Change theme">
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu">
    <button mat-menu-item (click)="setTheme('system')"><mat-icon>contrast</mat-icon>System</button>
    <button mat-menu-item (click)="setTheme('light')"><mat-icon>light_mode</mat-icon>Light</button>
    <button mat-menu-item (click)="setTheme('dark')"><mat-icon>dark_mode</mat-icon>Dark</button>
  </mat-menu>
</mat-toolbar>

<main>
  <router-outlet />
</main>
