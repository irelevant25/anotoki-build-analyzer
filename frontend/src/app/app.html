<!--
  The gate shows the pages while the site is ready, and its own page while it is not (core/site-status.ts). The
  pages come as a template, which the gate makes only while it shows them: nothing behind its page runs. The
  marker is what makes it the pages (@anotoki/lib 0.2.0): an unmarked template would draw nothing.
-->
<anotoki-site-gate>
    <ng-template anotokiSitePages>
        <router-outlet />
    </ng-template>
</anotoki-site-gate>

<!-- The kit's "Are you sure?" and its messages: once, for every page and for the gate's page alike. -->
<anotoki-confirm-host />
<anotoki-toast-host />
