<div class="page">
  <div class="panel hero" role="alert">
    <mat-icon class="hero-icon">construction</mat-icon>
    <h1>{{ 'notSetUp.title' | translate }}</h1>
    <p>{{ 'notSetUp.lead' | translate }}</p>
    <p class="muted">{{ 'notSetUp.owner' | translate }}</p>
    <div class="row wrap center">
      <a mat-flat-button [href]="setupUrl()"><mat-icon>settings</mat-icon>{{ 'notSetUp.open' | translate }}</a>
      <button mat-stroked-button (click)="reload()"><mat-icon>refresh</mat-icon>{{ 'notSetUp.tryAgain' | translate }}</button>
    </div>
    <p class="muted small">{{ 'notSetUp.notOwner' | translate }}</p>
  </div>
</div>
