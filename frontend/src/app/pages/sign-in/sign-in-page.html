<div class="page">
  <div class="panel hero">
    <mat-icon class="hero-icon">auto_awesome</mat-icon>
    <h1>Build Analyzer</h1>
    <p class="muted">{{ 'signIn.intro' | translate }}</p>

    @if (auth.lastError(); as problem) {
      <p class="notice" role="alert">{{ problem.key | translate: problem.params }}</p>
    }

    @if (auth.available()) {
      <button mat-flat-button (click)="signIn()"><mat-icon>login</mat-icon>{{ 'common.signIn' | translate }}</button>
    } @else {
      <p class="notice">{{ 'signIn.unreachable' | translate }}</p>
    }
  </div>
</div>
