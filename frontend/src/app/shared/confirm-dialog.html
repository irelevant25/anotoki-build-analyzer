<h2 mat-dialog-title>{{ question.title }}</h2>

@if (question.message) {
  <mat-dialog-content>
    <p class="message">{{ question.message }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions align="end">
  <button mat-button cdkFocusInitial [mat-dialog-close]="false">{{ question.cancelLabel }}</button>
  <button mat-flat-button class="confirm" [class.danger]="question.danger" [mat-dialog-close]="true">{{ question.confirmLabel }}</button>
</mat-dialog-actions>
