<button
  #button
  type="button"
  class="switcher"
  id="language-button"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  aria-controls="language-menu"
  [attr.aria-label]="
    'anotoki.language.button' | translate: { name: currentName(), code: currentCode() }
  "
  [attr.aria-busy]="switching() ? 'true' : null"
  (click)="toggle()"
>
  {{ currentCode() }}
</button>

@if (open()) {
  <div
    #menu
    class="menu"
    role="menu"
    id="language-menu"
    aria-labelledby="language-button"
    (keydown)="onMenuKeydown($event)"
  >
    @for (language of languages.offered(); track language.code) {
      <button
        type="button"
        role="menuitemradio"
        class="menu-item"
        [attr.aria-checked]="language.code === languages.current()"
        [attr.lang]="language.code"
        (click)="choose(language.code)"
      >
        <span class="menu-label">{{ language.name }}</span>
        @if (language.code === languages.current()) {
          <mat-icon aria-hidden="true">check</mat-icon>
        }
      </button>
    }
  </div>
}
