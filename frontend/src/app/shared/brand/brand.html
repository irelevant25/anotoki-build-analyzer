@if (link(); as link) {
  <a class="brand" [routerLink]="link" [attr.aria-label]="linkLabel()">
    <ng-container [ngTemplateOutlet]="mark" />
  </a>
} @else {
  <span class="brand">
    <ng-container [ngTemplateOutlet]="mark" />
  </span>
}

<ng-template #mark>
  <img src="anotoki.png" alt="" [attr.width]="size()" [attr.height]="size() * 0.835" />
  <span class="wordmark" [class.is-short]="!showName()">
    @if (showName()) {
      <span class="name">anotoki</span>
    }
    @if (area()) {
      <span class="area">{{ area() }}</span>
    }
  </span>
</ng-template>
