@if (!auth.signedIn()) {
  <anotoki-alert class="visitor-notice" tone="info">
    {{ 'visitor.notice' | translate: { days: meta.visitorDays() } }}
    @if (auth.available()) {
      <div alertActions>
        <button anotokiButton size="sm" (click)="signIn()">
          <anotoki-icon name="logIn" [size]="16" />{{ 'common.signIn' | translate }}
        </button>
      </div>
    }
  </anotoki-alert>
}
