@if (changelog.current(); as version) {
  <footer class="footer">
    <span class="version">{{ 'footer.version' | translate: { version: version } }}</span>
    <span class="dot" aria-hidden="true">·</span>
    <button type="button" class="whats-new" (click)="changelog.open()">
      {{ 'whatsNew.title' | translate }}
    </button>
  </footer>
}
