<anotoki-card class="visitor-hero">
  <anotoki-icon class="hero-icon" name="search" [size]="48" />
  <h2>{{ 'home.title' | translate }}</h2>
  <p class="muted">{{ 'home.text' | translate }}</p>
  <div class="actions">
    <a anotokiButton variant="primary" routerLink="/import"
      ><anotoki-icon name="upload" [size]="18" />{{ 'home.import' | translate }}</a
    >
    @for (game of games; track game) {
      <a anotokiButton [routerLink]="['/builds', game]">{{
        'home.browse' | translate: { game: gameLabels[game] }
      }}</a>
    }
  </div>
  @if (auth.available()) {
    <div class="sign-in">
      <p class="muted small">{{ 'home.signInText' | translate }}</p>
      <button anotokiButton variant="ghost" (click)="signIn()">
        <anotoki-icon name="logIn" [size]="18" />{{ 'common.signIn' | translate }}
      </button>
    </div>
  }
</anotoki-card>
